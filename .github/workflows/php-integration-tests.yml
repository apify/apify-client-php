name: PHP integration tests

# Runs the PHP client tests for PRs to master that touch PHP code, tests, examples or documentation, and on
# manual dispatch from any branch.
on:
  pull_request:
    branches: [master]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - '.php-cs-fixer.dist.php'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
      # The "Test examples" step checks the documentation snippets.
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/php-integration-tests.yml'
  workflow_dispatch:

# One run per ref at a time, since the runs share the test account.
concurrency:
  group: php-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests with the PECL brotli and zstd extensions, so their real codec tests run instead of skipping.
  # The `test` job has neither, which covers the gzip fallback. Needs no API token.
  unit-codecs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP (with brotli and zstd)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, json, curl, zlib, brotli, zstd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fail if a codec extension is missing
        run: |
          if ! php -r "exit(extension_loaded('brotli') && extension_loaded('zstd') ? 0 : 1);"; then
            echo "::error::The brotli or zstd extension failed to load; the real codec tests would skip."
            exit 1
          fi

      - name: Unit tests (brotli and zstd)
        run: vendor/bin/phpunit --testsuite unit

  # The zstd integration tests, with the PECL zstd extension that the `test` job lacks. They skip themselves
  # without the extension or the token, so both are checked first.
  integration-zstd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP (with zstd)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, json, curl, zlib, zstd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Require the zstd extension and APIFY_TOKEN
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if ! php -r "exit(extension_loaded('zstd') ? 0 : 1);"; then
            echo "::error::The zstd extension failed to load; the zstd integration tests would skip."
            exit 1
          fi
          if [ -z "${APIFY_TOKEN}" ]; then
            echo "::error::APIFY_TOKEN secret is empty or missing; the zstd integration tests would skip."
            exit 1
          fi

      - name: Integration tests (zstd)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: vendor/bin/phpunit --testsuite integration --filter ZstdCompressionIntegrationTest

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          # intl is optional, and loaded so that the punycode test runs.
          extensions: mbstring, json, curl, zlib, intl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Formatting (PSR-12, php-cs-fixer).
      - name: Check formatting (php-cs-fixer)
        run: composer lint

      # Static analysis.
      - name: Static analysis (PHPStan)
        run: composer stan

      # Offline unit tests with a mock transport.
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      # The integration tests skip themselves without APIFY_TOKEN, so fail here instead of passing silently.
      - name: Require APIFY_TOKEN secret
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "${APIFY_TOKEN}" ]; then
            echo "::error::APIFY_TOKEN secret is empty or missing; integration tests would not run against the API."
            exit 1
          fi

      - name: Integration tests
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: vendor/bin/phpunit --testsuite integration

      # Runs the documentation examples against the live API (ExamplesTest) and lints every PHP snippet
      # of the documentation (DocSnippetsTest).
      - name: Test examples
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: vendor/bin/phpunit --testsuite examples
